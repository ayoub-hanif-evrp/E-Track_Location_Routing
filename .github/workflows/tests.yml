name: Offline unit tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Restore multiroute graph artifact
        env:
          GRAPH_ARTIFACT_URL: ${{ secrets.GRAPH_ARTIFACT_URL }}
          # Public fallback: GitHub Release asset (set when publishing multiroute-graph-v1)
          GRAPH_ARTIFACT_FALLBACK_URL: https://github.com/ayoub-hanif-evrp/E-Track_Location_Routing/releases/download/multiroute-graph-v1/multiroute_graph.zip
        run: |
          set -e
          DEST=data/processed/multiroute
          mkdir -p "$DEST"
          if [ -f "$DEST/nodes.csv" ] && [ -f "$DEST/edges.csv" ]; then
            echo "Graph CSVs already present in checkout"
            exit 0
          fi
          URL="${GRAPH_ARTIFACT_URL:-$GRAPH_ARTIFACT_FALLBACK_URL}"
          echo "Fetching graph from $URL"
          if ! curl -fsSL "$URL" -o /tmp/multiroute_graph.zip; then
            echo "Graph download failed — graph-dependent tests will skip"
            exit 0
          fi
          python - <<'PY'
          import zipfile
          from pathlib import Path
          dest = Path("data/processed/multiroute")
          with zipfile.ZipFile("/tmp/multiroute_graph.zip") as zf:
              zf.extractall(dest)
          print("extracted", sorted(p.name for p in dest.glob("*.csv")))
          PY
      - name: Run offline unit tests
        run: pytest -q -m "not integration"
