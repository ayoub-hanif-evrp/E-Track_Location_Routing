# Task 05B — Physics-validated multi-route Moroccan MRLS (path-union)
# Exactness only over the directed union of verified OD path alternatives.

disclaimer: >
  Multi-route MRLS on a reduced decision graph built from verified OSM path
  alternatives (Casa–Marrakech–Agadir). Not optimality over the full Moroccan
  network. Scenario speeds are research defaults / OSM maxspeed when sane —
  not observed HGV speeds. Chargers are direction-specific ADM candidates with
  topology-verified on-union attach only (no proximity snap in baseline);
  remain hypothetical (HGV access not certified). Fixed graph across charger
  activation subsets. HGV legality from OSM tags is incomplete (unknown
  retained; explicit no filtered at build). Discrete optimality ≠ continuous
  physics certification ≠ empirical validation.

vehicle_config: configs/vehicles/eactros_600.yaml
refrigeration_config: configs/energy/refrigeration_approx.yaml
corridor_config: configs/multiroute_corridor.yaml
morocco_pilot_config: configs/optimization/morocco_pilot.yaml
candidate_sites_csv: data/processed/candidate_sites.csv

time_step_min: 5
# Coarser grid for path-union tractability; sensitivity uses 5 kWh on one mission
energy_quantum_kwh: 10
energy_quantum_sensitivity_kwh: 5
deadline_steps: 240
wait_max_steps: 0

# Legacy path-set benchmark only (not used for scientific 05B rows)
consumption_kwh_per_km: 1.0

E_truck_cap: 600
E_truck_min: 60
E_truck_init: 600

physics:
  # Prefer per-arc COP-DEM when arc_{id}.json exists; else documented flat fallback
  terrain_mode: dem
  elevation_dir: data/processed/multiroute/elevation
  drive_cache_dir: data/processed/multiroute/drive_tables
  gcm_kg: 25000.0      # light GCM research scenario
  gcm_heavy_kg: 40000.0
  road_cost_per_km: 1.0
  # Tractability: induce union from shortest + up to N-1 most diverse alternatives
  max_alternatives_for_union: 2

charger:
  power_kw: 350.0
  eta: 0.95
  price_uniform_cents: 20
  # Baseline scientific topology: never attach via geodesic proximity alone
  allow_proximity_snap: false
  max_snap_m: 2500.0

# Direction-specific ADM facilities (entrance_and_exit + travel_direction + osm_id).
# Keys are unique per physical directional site. No R_i midpoints. No proximity snap.
grounded_chargers:
  default:
    - key: settat_ca
      name_contains: SETTAT
      travel_direction: "Casablanca→Agadir"
      osm_id: "127661106"
    - key: benguerir_ca
      name_contains: BENGUERIR
      travel_direction: "Casablanca→Agadir"
      osm_id: "127661099"
    - key: amskroud_ca
      name_contains: AMSKROUD
      travel_direction: "Casablanca→Agadir"
      osm_id: "1530179371"
  casa_marrakech:
    - key: settat_ca
      name_contains: SETTAT
      travel_direction: "Casablanca→Agadir"
      osm_id: "127661106"
    - key: benguerir_ca
      name_contains: BENGUERIR
      travel_direction: "Casablanca→Agadir"
      osm_id: "127661099"
  casa_agadir:
    - key: settat_ca
      name_contains: SETTAT
      travel_direction: "Casablanca→Agadir"
      osm_id: "127661106"
    - key: benguerir_ca
      name_contains: BENGUERIR
      travel_direction: "Casablanca→Agadir"
      osm_id: "127661099"
    - key: amskroud_ca
      name_contains: AMSKROUD
      travel_direction: "Casablanca→Agadir"
      osm_id: "1530179371"
  marrakech_agadir:
    - key: amskroud_ca
      name_contains: AMSKROUD
      travel_direction: "Casablanca→Agadir"
      osm_id: "1530179371"
  marrakech_casa:
    - key: settat_ac
      name_contains: SETTAT
      travel_direction: "Agadir→Casablanca"
      osm_id: "127661105"
    - key: benguerir_ac
      name_contains: BENGUERIR
      travel_direction: "Agadir→Casablanca"
      osm_id: "127661098"
  agadir_casa:
    - key: settat_ac
      name_contains: SETTAT
      travel_direction: "Agadir→Casablanca"
      osm_id: "127661105"
    - key: benguerir_ac
      name_contains: BENGUERIR
      travel_direction: "Agadir→Casablanca"
      osm_id: "127661098"
  agadir_marrakech:
    - key: amskroud_ac
      name_contains: AMSKROUD
      travel_direction: "Agadir→Casablanca"
      # No documented Agadir→Casablanca Amskroud entrance_and_exit in candidate_sites;
      # listed for unresolved-audit coverage only.
      osm_id: ""

solver:
  max_seconds: 90.0
  max_expansions: 800000

outputs:
  processed_dir: data/processed/multiroute
  experiments_csv: results/multiroute_physics_experiments.csv
  figures_dir: reports/figures

speed_policy:
  use_osm_maxspeed: true
  maxspeed_sane_min_kmh: 30
  maxspeed_sane_max_kmh: 120
  class_defaults_kmh:
    motorway: 80
    trunk: 70
    primary: 60
    default: 50

# Scientific pilot portfolio (Stage 6)
pilot_od_pairs:
  - casa_marrakech
  - casa_agadir
  - marrakech_agadir

od_pairs:
  - id: casa_agadir
  - id: agadir_casa
  - id: casa_marrakech
  - id: marrakech_casa
  - id: marrakech_agadir
  - id: agadir_marrakech
