# SYNTHETIC charger-placement B&B pruning demo (Task 04B).
# Not Moroccan traffic / not HGV-certified infrastructure.
# 12 binary sites; each mission needs its own station on a private O–Si–D path.

note: >
  Synthetic independent-mission placement instance for proved pruning demo.
  Exhaustive reference is 2^12 = 4096 subsets (manageable).

annualization:
  interest_rate: 0.08
  lifetime_years: 15

cents_to_currency: 0.01

solver:
  max_seconds: 10.0
  max_expansions: 100000

budgets:
  - name: B3
    max_capex: 300.0
  - name: Ball
    max_capex: null

# Sites s00..s11; s09–s11 are expensive (secondary prune fodder)
site_capex:
  s00: 100.0
  s01: 100.0
  s02: 100.0
  s03: 100.0
  s04: 100.0
  s05: 100.0
  s06: 100.0
  s07: 100.0
  s08: 100.0
  s09: 250.0
  s10: 250.0
  s11: 250.0

sites:
  - {id: s00, station_key: S00, direction: synth, label: synth_0}
  - {id: s01, station_key: S01, direction: synth, label: synth_1}
  - {id: s02, station_key: S02, direction: synth, label: synth_2}
  - {id: s03, station_key: S03, direction: synth, label: synth_3}
  - {id: s04, station_key: S04, direction: synth, label: synth_4}
  - {id: s05, station_key: S05, direction: synth, label: synth_5}
  - {id: s06, station_key: S06, direction: synth, label: synth_6}
  - {id: s07, station_key: S07, direction: synth, label: synth_7}
  - {id: s08, station_key: S08, direction: synth, label: synth_8}
  - {id: s09, station_key: S09, direction: synth, label: synth_9}
  - {id: s10, station_key: S10, direction: synth, label: synth_10}
  - {id: s11, station_key: S11, direction: synth, label: synth_11}

missions:
  - {id: M00, weight: 1.0, direction: synth}
  - {id: M01, weight: 1.0, direction: synth}
  - {id: M02, weight: 1.0, direction: synth}
  - {id: M03, weight: 1.0, direction: synth}
  - {id: M04, weight: 1.0, direction: synth}
  - {id: M05, weight: 1.0, direction: synth}
  - {id: M06, weight: 1.0, direction: synth}
  - {id: M07, weight: 1.0, direction: synth}
  - {id: M08, weight: 1.0, direction: synth}
  - {id: M09, weight: 1.0, direction: synth}
  - {id: M10, weight: 1.0, direction: synth}
  - {id: M11, weight: 1.0, direction: synth}

# Each mission: O – Si – D; needs charge at Si (same physics as Task 03A B_charge_required)
mission_instances:
  - name: M00
    nodes: [O, S00, D]
    origin: O
    destination: D
    deadline_steps: 30
    E_truck_cap: 100
    E_truck_min: 10
    E_truck_init: 50
    power_source: A
    refrigeration_on: false
    wait_max_steps: 0
    stations:
      - {node: S00, power_kw: 60, eta: 1.0, price_cents_per_grid_kwh: 2, compatible: true}
    active_stations: []
    arcs:
      - {u: O, v: S00, dt_steps: 2, dE_truck_kwh: 40, road_cost: 5, power_ok: true}
      - {u: S00, v: D, dt_steps: 2, dE_truck_kwh: 40, road_cost: 5, power_ok: true}
