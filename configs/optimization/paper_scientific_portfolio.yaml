# Pre-registered BEFORE solving (national taper campaign).
# Illustrative national demand — not observed OD truck counts.
# Chargers are hypothetical HGV CCS at topology-validated ADM sites.
# charging_model=ccs_soc_taper_research_envelope (default in MRLS/replay).

multiroute_pilot_config: configs/optimization/multiroute_pilot.yaml
national_portfolio: configs/optimization/national_longhaul_portfolio.yaml
charging_model: ccs_soc_taper_research_envelope
disclaimer: >
  National long-haul scientific campaign under SOC CCS research taper.
  Tangier–Rabat–Casablanca–Fès–Oujda–Marrakech–Agadir. OSM+COP-DEM+ADM
  topology only; not observed truck counts. Taper is a research envelope,
  not an OEM-measured curve. All chargers hypothetical.

sites:
- id: y_settat_ca
  direction: casablanca_to_agadir
  station_key: settat_ca
  label: Settat (CA)
  evidence_class: hypothetical_future_truck_site
- id: y_benguerir_ca
  direction: casablanca_to_agadir
  station_key: benguerir_ca
  label: Benguerir (CA)
  evidence_class: hypothetical_future_truck_site
- id: y_amskroud_ca
  direction: casablanca_to_agadir
  station_key: amskroud_ca
  label: Amskroud (CA)
  evidence_class: hypothetical_future_truck_site
- id: y_settat_ac
  direction: agadir_to_casablanca
  station_key: settat_ac
  label: Settat (AC)
  evidence_class: hypothetical_future_truck_site
- id: y_benguerir_ac
  direction: agadir_to_casablanca
  station_key: benguerir_ac
  label: Benguerir (AC)
  evidence_class: hypothetical_future_truck_site
- id: y_bouznika_cr
  direction: casablanca_to_rabat
  station_key: bouznika_cr
  label: Bouznika (Casa→Rabat)
  evidence_class: hypothetical_future_truck_site
- id: y_bouznika_rc
  direction: rabat_to_casablanca
  station_key: bouznika_rc
  label: Bouznika (Rabat→Casa)
  evidence_class: hypothetical_future_truck_site
- id: y_larache_rt
  direction: rabat_to_tanger
  station_key: larache_rt
  label: Larache (Rabat→Tanger Med)
  evidence_class: hypothetical_future_truck_site
- id: y_assilah_tr
  direction: tanger_to_rabat
  station_key: assilah_tr
  label: Assilah (Tanger Med→Rabat)
  evidence_class: hypothetical_future_truck_site

capex_scenarios:
  equal:
    note: illustrative equal CAPEX (normalized research units); one site = 100
    site_capex:
      y_settat_ca: 100.0
      y_benguerir_ca: 100.0
      y_amskroud_ca: 100.0
      y_settat_ac: 100.0
      y_benguerir_ac: 100.0
      y_bouznika_cr: 100.0
      y_bouznika_rc: 100.0
      y_larache_rt: 100.0
      y_assilah_tr: 100.0

annualization:
  interest_rate: 0.08
  lifetime_years: 15
cents_to_currency: 0.01
road_cost_per_km_cents: 100.0
cargo_payload_kg: 5300.0

budgets:
- name: B0
  max_capex: 0.0
- name: B1
  max_capex: 100.0
- name: B2
  max_capex: 200.0
- name: B3
  max_capex: 300.0
- name: Ball
  max_capex: null

price_modes:
- uniform

demand_scenarios:
  headline_national_equal:
    note: >
      Equal-weight national headline: northbound Agadir→Casa, Tangier→Casa,
      Rabat→Fès, plus southbound Casa→Marrakech / Casa→Agadir stress SOC 0.5.
      Not observed shipment counts.
    panel: mixed_headline
    missions:
    - id: M_agadir_casa_s08
      od_id: agadir_casa
      weight: 1.0
      E_truck_init: 0
      E_init_soc_frac: 0.8
      refrigeration_on: true
      terrain_mode: dem
      weather_id: cool
      gcm: light
      cargo_payload_kg: 5300.0
