# Pre-registered BEFORE solving (paper scientific results campaign).
# Illustrative corridor demand — not observed OD truck counts.
# Chargers are hypothetical HGV CCS at topology-validated ADM sites.

multiroute_pilot_config: configs/optimization/multiroute_pilot.yaml
disclaimer: >
  Paper scientific campaign. Northbound agricultural application is Agadir→Casablanca
  refrigerated tomato proxy. Southbound/return panels are separate research scenarios.
  National tomato exports contextualize the application only; they are not OD volumes.
  All chargers hypothetical. Axle compliance unverified.

sites:
- id: y_settat_ca
  direction: casablanca_to_agadir
  station_key: settat_ca
  label: Settat (CA)
  evidence_class: hypothetical_future_truck_site
- id: y_benguerir_ca
  direction: casablanca_to_agadir
  station_key: benguerir_ca
  label: Benguerir (CA)
  evidence_class: hypothetical_future_truck_site
- id: y_amskroud_ca
  direction: casablanca_to_agadir
  station_key: amskroud_ca
  label: Amskroud (CA)
  evidence_class: hypothetical_future_truck_site
- id: y_settat_ac
  direction: agadir_to_casablanca
  station_key: settat_ac
  label: Settat (AC)
  evidence_class: hypothetical_future_truck_site
- id: y_benguerir_ac
  direction: agadir_to_casablanca
  station_key: benguerir_ac
  label: Benguerir (AC)
  evidence_class: hypothetical_future_truck_site

capex_scenarios:
  equal:
    note: illustrative equal CAPEX (normalized research units); one site = 100
    site_capex:
      y_settat_ca: 100.0
      y_benguerir_ca: 100.0
      y_amskroud_ca: 100.0
      y_settat_ac: 100.0
      y_benguerir_ac: 100.0

annualization:
  interest_rate: 0.08
  lifetime_years: 15
cents_to_currency: 0.01
road_cost_per_km_cents: 100.0
cargo_payload_kg: 5300.0

budgets:
- name: B0
  max_capex: 0.0
- name: B1
  max_capex: 100.0
- name: B2
  max_capex: 200.0
- name: B3
  max_capex: 300.0
- name: Ball
  max_capex: null

price_modes:
- uniform

demand_scenarios:
  # Headline continuity: same 3-mission equal-weight portfolio as final correction.
  headline_equal_3:
    note: >
      Continuity with final_operational_* at corrected ops metric. Southbound SOC0.5
      stress; northbound SOC0.8 depot. Not observed shipment counts.
    panel: mixed_headline
    missions:
    - id: M_casa_marrakech_s05
      od_id: casa_marrakech
      weight: 1.0
      E_truck_init: 0
      E_init_soc_frac: 0.5
      refrigeration_on: true
      terrain_mode: dem
      weather_id: cool
      gcm: light
      cargo_payload_kg: 5300.0
      commodity: firm_ripe_fresh_tomatoes
      od_evidence_class: corridor_research_proxy
      direction_panel: southbound_return
