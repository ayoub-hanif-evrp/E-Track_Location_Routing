# Engineering approximation of refrigerated trailer thermal load.
# Inspired by cold-chain heat-load structure (transmission + optional infiltration).
# NOT a calibrated reproduction of Bank et al. (2025) or any proprietary TRU model.

model_id: refrigeration_ua_cop_approx
disclaimer: >
  Approximate research model for pilot energy accounting. Parameters are assumed /
  literature-order. Do not claim empirical validation against measured TRU logs.

setpoint_c: 2.0
setpoint_note: "Refrigerated freight setpoint example (+2 °C)"

# Overall heat-transfer coefficient × area (W/K) for insulated box
UA_w_per_k: 80.0
UA_provenance: assumed
UA_sensitivity_w_per_k: [50.0, 120.0]
UA_note: "Order-of-magnitude insulated semi-trailer; not MB or Thermo King calibrated"

# Door / infiltration term set to 0 in pilot (plan default)
infiltration_w: 0.0
infiltration_note: "Pilot sets door/infiltration = 0"

# COP bounds as function of ambient (simple piecewise / linear clip)
# COP decreases as ambient rises above setpoint
cop:
  cop_at_delta_0: 2.8
  cop_at_delta_40: 1.2
  cop_min: 1.0
  cop_max: 3.2
  provenance: assumed
  note: "Tabulated linear COP(ΔT) with hard bounds; engineering guess"

# Config A: TRU draws from tractor usable battery
# Config B: independent trailer pack; tractor SOC unaffected by TRU
power_source:
  A:
    draws_from: tractor_battery
    description: "TRU energy deducted from tractor usable pack"
  B:
    draws_from: trailer_battery
    description: "Independent trailer pack; tractor SOC unaffected by TRU"
    trailer_usable_kwh: 30.0
    trailer_usable_provenance: assumed
    trailer_usable_sensitivity_kwh: [20.0, 40.0]
    trailer_soc_initial: 1.0
    trailer_soc_min: 0.10

citation_inspiration: >
  Bank et al. (2025) cold-chain / refrigerated truck energy literature —
  methodological inspiration only at abstract level; parameters here are NOT
  claimed as a calibrated reproduction.
