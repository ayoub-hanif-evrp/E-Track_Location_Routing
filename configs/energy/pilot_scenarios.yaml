# Task 02/02B pilot experiment matrix (Problem A corridor energy; no charger optimization)

vehicle_config: configs/vehicles/eactros_600.yaml
refrigeration_config: configs/energy/refrigeration_approx.yaml
baseline_geojson: results/baseline_routes.geojson
baseline_json: results/baseline_routes.json

cruise_kmh: 80.0

# Gross combination mass (GCM) scenarios — NOT cargo payload alone.
# cargo_payload_kg = gcm_kg − (unladen_tractor + unladen_trailer assumptions)
gcm_scenarios:
  light:
    gcm_kg: 25000.0
    label: gcm_light_25t
    note: "Pilot light gross combination mass (GCM), not cargo payload"
  heavy:
    gcm_kg: 40000.0
    label: gcm_heavy_40t
    note: "GCM matching maker published range-test towing-weight condition order (~40 t)"

directions:
  - casablanca_to_agadir
  - agadir_to_casablanca

weather_days:
  hot:
    label: hot_day
    default_date: "2025-07-15"
  cool:
    label: cool_day
    default_date: "2025-01-15"

refrigeration:
  - "off"
  - "on"

terrain:
  - flat
  - dem

power_source:
  - "A"
  - "B"

corridor_weather_points:
  casablanca_end:
    lat: 33.5731
    lon: -7.5898
    label: Casablanca-end
  marrakech_mid:
    lat: 31.6295
    lon: -7.9811
    label: Marrakech-mid
  agadir_end:
    lat: 30.4278
    lon: -9.5981
    label: Agadir-end

outputs:
  csv: results/energy_pilot.csv
  figures_dir: reports/figures
  dem_meta: data/processed/energy/dem_sampling_meta.json
  weather_selection: data/raw/weather/selection.json
