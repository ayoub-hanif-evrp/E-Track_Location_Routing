# Volvo FH Electric 4×2 tractor — PROSPECTIVE Moroccan highway research pack
# model_status: prospective_morocco (not verified in Moroccan refrigerated long-haul fleets)
# Usable capacity scenario: Moroccan market page (475 kWh). See also *_usable460.yaml.
# Access date for manufacturer pages: 2026-11-10
# Do NOT mix with FH Aero Electric Extended Range / MCS / FE Electric.

vehicle_id: volvo_fh_electric_4x2_540kwh_usable475
model_status: prospective_morocco
manufacturer: Volvo Trucks
model: FH Electric
model_generation_note: "FH Electric product pages (MA/global); not 2026 Aero Extended Range"
configuration_axles: "4x2_tractor"
battery_variant: "6_packs_up_to_540kwh_installed"
usable_scenario: usable_ma_475
name: "Volvo FH Electric 4x2 tractor (540 kWh installed / 475 kWh usable MA page)"

sources:
