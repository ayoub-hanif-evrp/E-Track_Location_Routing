  eta_regen_sensitivity: [0.55, 0.80]

auxiliaries:
  P_aux_w: 2500.0
  provenance: assumed
  note: "Constant cabin/HVAC/electronics; research parameter"
  P_aux_sensitivity_w: [1000.0, 4000.0]

soc:
  soc_initial: 1.0
  soc_min: 0.10
  soc_max: 1.0
